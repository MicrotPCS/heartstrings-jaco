# Heartstrings Jaco — Render static site
# https://dashboard.render.com → New → Blueprint
services:
  - type: web
    name: heartstrings-country
    runtime: static
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    domains:
      - heartstrings-country.com
      - www.heartstrings-country.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
